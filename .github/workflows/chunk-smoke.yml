name: Real KMOB chunk smoke check
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/chunk-smoke.yml'
jobs:
  live-chunks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ./backend
      - name: Read S3 chunk listing and decode a complete sweep when available
        shell: bash
        run: |
          python - <<'PY'
          import boto3
          from botocore import UNSIGNED
          from botocore.config import Config
          from gr2lite.chunks import latest_listing, BUCKET, IncrementalChunkPoller
          from gr2lite.live import RadarStore
          s3=boto3.client("s3",region_name="us-east-1",config=Config(
              signature_version=UNSIGNED,connect_timeout=8,read_timeout=30))
          stamp,keys=latest_listing(s3)
          print("UTC volume stamp:",stamp,"contiguous chunks:",len(keys))
          print("S chunk:",keys[0])
          store=RadarStore(limit=2)
          poller=IncrementalChunkPoller(store)
          outcome=poller.poll_once()
          print("new completed sweeps published:",outcome)
          print("status:",store.status())
          print("reused sweeps:",store.status().get("latency_metrics",{}).get("reused_sweeps"))
          print("newly decoded sweeps:",store.status().get("latency_metrics",{}).get("newly_decoded_sweeps"))
          assert store.status()["state"] in ("ready","delayed","stale","empty")
          assert store.status()["volume_count"] >= (1 if outcome else 0)
          if outcome:
              assert store.list()[0].descriptor.sweeps
              metadata=store.list()[0].descriptor
              print('VCP:',metadata.vcp,'Dynamic strategy:',metadata.dynamic_scan_type,
                    'AVSET enabled:',metadata.avset_enabled,
                    'Volume complete:',metadata.volume_complete)
              from gr2lite.models import Moment
              import numpy as np
              vel_count=0
              for (_,moment),values in store.list()[0].arrays.items():
                  if moment == Moment.VEL:
                      vel_count+=1
                      sentinels=int(np.count_nonzero(np.isclose(values,-64.5,atol=0.00001,rtol=0)))
                      print("Velocity missing-code sentinel check:",sentinels,"in sweep",vel_count)
                      assert sentinels==0, "Decoded velocity still contains raw-code-0 fill values"
              print("PASS: incremental chunk stream decoded at least one complete cut")
          else:
              print("INCONCLUSIVE: no complete cut in latest S3 listing")
          PY
