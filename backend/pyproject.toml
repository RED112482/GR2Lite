[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gr2lite-backend"
version = "0.1.0"
description = "Experimental archive decoder and radar data contract for GR2Lite"
requires-python = ">=3.12"
dependencies = [
  "xradar>=0.13,<0.14",
  "numpy>=2.0,<3",
  "pydantic>=2.8,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "boto3>=1.34,<2",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
gr2lite = "gr2lite.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gr2lite*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
